services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0
    container_name: rust-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-0000}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metal_corrosion_db}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rust-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-metal_corrosion_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-0000}
      JWT_SECRET: ${JWT_SECRET:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:3000,http://8.159.143.133,http://8.159.143.133:3000}
      APP_STORAGE_IMAGE_LOCATION: ${APP_STORAGE_IMAGE_LOCATION:-file:/app/images/}
      TZ: Asia/Shanghai
    volumes:
      - ./images:/app/images
    depends_on:
      - mysql
    networks:
      - rust-network

volumes:
  mysql_data:

networks:
  rust-network:
    driver: bridge
